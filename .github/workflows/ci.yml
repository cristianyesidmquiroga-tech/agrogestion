name: CI
on: [push, pull_request]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: python -m scripts.exportar_contrato --verificar
      - run: ruff check .
      - run: mypy app
      - run: bandit -r app -ll
      - run: pip-audit --skip-editable || true
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  modulos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: pytest tests/modulos tests/test_health.py --cov=app --cov-report=term-missing

  roles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: pytest tests/roles

  vistas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: pytest tests/vistas

  e2e:
    runs-on: ubuntu-latest
    needs: [modulos, roles, vistas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: pytest tests/e2e
