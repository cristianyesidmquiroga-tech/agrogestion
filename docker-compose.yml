services:
  agrogestion:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite+aiosqlite:////data/agrogestion.db
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el entorno}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Define FIELD_ENCRYPTION_KEY en el entorno}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ALERT_ALLOWED_HOSTS: ${ALERT_ALLOWED_HOSTS:-}
    volumes:
      - agrogestion_data:/data
    restart: unless-stopped

volumes:
  agrogestion_data:
