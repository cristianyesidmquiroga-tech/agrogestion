[project]
name = "agrogestion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.14,<2",
  "asyncpg>=0.29,<1",
  "aiosqlite>=0.20,<1",
  "pydantic-settings>=2.6,<3",
  "email-validator>=2.2,<3",
  "PyJWT>=2.9,<3",
  "bcrypt>=4.2,<6",
  "cryptography>=43,<45",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13", "bandit>=1.7", "pip-audit>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
omit = ["app/main.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
